<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-8JH6GYNRZC');

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 420px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.12);
      text-align: center;
    }

    .logo {
      width: 180px;
      margin-bottom: 20px;
    }

    h1 {
      color: #486c68;
      margin-bottom: 8px;
      font-size: 28px;
    }

    p {
      color: #666;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin: 14px 0;
      padding: 16px;
      background: #486c68;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: #395652;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .card {
        padding: 25px;
      }

      h1 {
        font-size: 24px;
      }

      .btn {
        font-size: 16px;
        padding: 14px;
      }

       🇲🇽 Menú Español

    <a class="btn"
       href="kapen-ha_menu-en.pdf?v=1"
